<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons (favicon.io set) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0c0f" />

    <title>Statmon — Pokémon stat tools</title>
    <meta
      name="description"
      content="Compare two Pokémon's base stats side by side — who's faster, hits harder, and is bulkier. A fast, minimalist set of Pokémon tools."
    />

    <!-- Open Graph / Twitter. NOTE(deploy): og:url + og:image must be absolute
         URLs (https://<domain>/…) for scrapers — swap in the production origin
         at deploy. og-image.png is exported from docs/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Statmon" />
    <meta property="og:title" content="Statmon — Pokémon stat tools" />
    <meta
      property="og:description"
      content="Compare two Pokémon's base stats side by side. A fast, minimalist set of Pokémon tools."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Statmon — a simple set of Pokémon tools"
    />
    <meta property="og:url" content="/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Statmon — Pokémon stat tools" />
    <meta
      name="twitter:description"
      content="Compare two Pokémon's base stats side by side. A fast, minimalist set of Pokémon tools."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
