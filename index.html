<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint edge to edge on a notched phone;
         the safe-area insets it needs in exchange are applied in index.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Icons (favicon.io set) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0c0f" />

    <title>Statmon — Pokémon comparison, dex, type chart and games</title>
    <meta
      name="description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types — each as of any generation — then drill it all in the games."
    />

    <!-- Open Graph / Twitter. og:url + og:image are absolute (scrapers require
         it), pointing at the production origin. Per-route og:url/title await
         SSR (D-005), so this copy has to describe the whole site rather than
         any one tool — which is why it names all four (D-063, D-091).
         og-image.png is exported from docs/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Statmon" />
    <meta
      property="og:title"
      content="Statmon — Pokémon comparison, dex, type chart and games"
    />
    <meta
      property="og:description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types — each as of any generation — then drill it all in the games."
    />
    <meta
      property="og:image"
      content="https://statmon.noahparknguyen.workers.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Statmon — a simple set of Pokémon tools"
    />
    <meta
      property="og:url"
      content="https://statmon.noahparknguyen.workers.dev/"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Statmon — Pokémon comparison, dex, type chart and games"
    />
    <meta
      name="twitter:description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types — each as of any generation — then drill it all in the games."
    />
    <meta
      name="twitter:image"
      content="https://statmon.noahparknguyen.workers.dev/og-image.png"
    />

    <!-- Fonts are self-hosted (D-061); the @font-face rules ship inside the
         app's own stylesheet, so there is no third-party request and nothing
         render-blocking here. These two preloads are the faces that paint
         first — body copy and headings — started before the CSS is parsed
         rather than after. The other eight faces (other weights, latin-ext)
         load on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-700-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
