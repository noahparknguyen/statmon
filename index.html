<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint edge to edge on a notched phone;
         the safe-area insets it needs in exchange are applied in index.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Icons, drawn from favicon.svg by `npm run build:icons`. With the .ico
         marked 32x32 and the SVG as the only other icon, Chrome draws the SVG.
         The .ico is for browsers that can't. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0c0f" />

    <title>Statmon — Pokémon comparison, dex, type chart, and games</title>
    <meta
      name="description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types, each as of any generation. Then drill it all in the games."
    />

    <!-- Open Graph and Twitter. og:url and og:image are absolute (scrapers
         require it), pointing at the production origin. Per-route titles
         would need server rendering, so this copy describes the whole site
         rather than one tool, which is why it names all four.
         og-image.png is exported from docs/og-image.html. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Statmon" />
    <meta
      property="og:title"
      content="Statmon — Pokémon comparison, dex, type chart, and games"
    />
    <meta
      property="og:description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types, each as of any generation. Then drill it all in the games."
    />
    <meta
      property="og:image"
      content="https://statmon.noahpn.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Statmon wordmark over the line: Pokémon stats, matchups, and games."
    />
    <meta property="og:url" content="https://statmon.noahpn.dev/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Statmon — Pokémon comparison, dex, type chart, and games"
    />
    <meta
      name="twitter:description"
      content="Compare two Pokémon head to head, rank the whole dex by any stat, and read the full type chart including dual types, each as of any generation. Then drill it all in the games."
    />
    <meta
      name="twitter:image"
      content="https://statmon.noahpn.dev/og-image.png"
    />

    <!-- Fonts are self-hosted: the @font-face rules ship inside the app's own
         stylesheet, so there's no third-party request and nothing
         render-blocking here. These two preloads are the faces that paint
         first, body copy and headings, started before the CSS is parsed
         rather than after. The other eight faces (other weights, latin-ext)
         load on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-700-latin.woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
