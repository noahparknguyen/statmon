# The checks that must stay green (05_roadmap). They existed as npm scripts and
# a line in the docs asking people to remember them; this is the part that does
# not depend on remembering.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: 22
          cache: npm

      - run: npm ci

      # Ordered cheapest-first, so an obvious failure reports in seconds rather
      # than after the browser sweep.
      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Contrast audit (WCAG AA)
        run: npm run audit:contrast

      - name: Docs links and anchors
        run: npm run check:docs

      # Needs dist/ from the Build step above, and Chrome, which is preinstalled
      # on the ubuntu-latest image. Catches horizontal overflow and WCAG 2.5.8
      # target sizes across 14 widths — the class of bug that is invisible to
      # every check above it (D-059).
      - name: Responsive width sweep
        run: npm run sweep:widths
        env:
          CHROME_PATH: /usr/bin/google-chrome
