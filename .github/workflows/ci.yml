# Runs the same ten checks as `pnpm run check`, so none of them depends on
# someone remembering to run it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm named by `packageManager` in package.json and the Node
      # named by `devEngines.runtime`, then runs `pnpm install`. With
      # `require-lockfile`, a missing pnpm-lock.yaml fails the job rather than
      # being quietly created.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Ordered cheapest-first, so an obvious failure reports in seconds rather
      # than after the browser sweep.
      - name: Lint
        run: pnpm run lint

      - name: Formatting
        run: pnpm run format:check

      # A static scan of src/ that needs no build, so it runs early. It catches
      # two utilities setting the same property in one class string, which
      # Tailwind resolves by stylesheet order rather than by the order they're
      # written.
      - name: Conflicting utilities
        run: pnpm run audit:classes

      # The same scan, asking whether every utility comes from the site's
      # closed sets of colours, text styles, spacing, radii, opacity steps, and
      # layers, as scripts/style-audit.mjs lists them.
      - name: Style allowlist
        run: pnpm run audit:styles

      # Opens every favicon file, which nothing else does: a broken one only
      # shows in a tab, a search result, or on a home screen.
      - name: Icons
        run: pnpm run check:icons

      - name: Unit tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Contrast audit (WCAG AA)
        run: pnpm run audit:contrast

      - name: Docs links and anchors
        run: pnpm run check:docs

      # Needs dist/ from the Build step, and Chrome. scripts/chrome.mjs finds a
      # Chrome binary itself, since its path can move between runner images;
      # CHROME_PATH overrides it. It catches horizontal overflow and touch
      # targets below WCAG 2.5.8's minimum at 14 widths, which no check above
      # can see.
      - name: Responsive width sweep
        run: pnpm run sweep:widths
